# CI/CD do frontend: Lint e build → Imagem Docker (Docker Hub) → Deploy (AWS Amplify) → Smoke test.
#
# - Em todo push e pull request: lint (ESLint) e checagem de tipos + build.
# - No branch mvp-comprafacil: o AWS Amplify publica o site sozinho a cada
#   push (veja amplify.yml). O smoke test espera a publicação, confere que o
#   site no ar é exatamente o build deste commit e que a API responde.
# - Imagem: em todo push monta e testa o container (nginx); no branch de
#   produção publica <DOCKERHUB_USERNAME>/corelist-frontend no Docker Hub.
#   Precisa da variável DOCKERHUB_USERNAME e do segredo DOCKERHUB_TOKEN.
name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  BRANCH_DE_PRODUCAO: mvp-comprafacil
  SITE_URL: ${{ vars.SITE_URL || 'https://mvp-comprafacil.dql3968zgbfv8.amplifyapp.com' }}

jobs:
  lint-e-build:
    name: Lint e build (TypeScript + Vite)
    runs-on: ubuntu-latest
    outputs:
      bundle: ${{ steps.bundle.outputs.arquivo }}

    steps:
      - uses: actions/checkout@v4

      # Vite 8 precisa de Node 20.19+ ou 22.12+ (o mesmo do Amplify).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Checagem de tipos e build
        env:
          VITE_API_URL: /api
        run: npm run build

      # O nome do arquivo principal tem o hash do conteúdo: se o site no ar
      # usar o mesmo nome, é este build que está publicado.
      - name: Arquivo principal do build
        id: bundle
        run: |
          arquivo="$(grep -o '/assets/index-[^"]*\.js' dist/index.html | head -1)"
          echo "arquivo=${arquivo}" >> "$GITHUB_OUTPUT"
          echo "Build: ${arquivo}"

  imagem:
    name: Imagem Docker (build, teste e push no Docker Hub)
    runs-on: ubuntu-latest
    needs: lint-e-build
    steps:
      - uses: actions/checkout@v4

      - name: Nome da imagem e versão
        id: nomes
        env:
          USUARIO: ${{ vars.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Tira espaços e quebras de linha coladas junto com o valor.
          USUARIO="$(printf '%s' "$USUARIO" | tr -d '[:space:]')"
          echo "usuario=${USUARIO}" >> "$GITHUB_OUTPUT"
          echo "imagem=${USUARIO:-local}/corelist-frontend" >> "$GITHUB_OUTPUT"
          echo "versao=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${GITHUB_REF_NAME}" = "${BRANCH_DE_PRODUCAO}" ] \
             && [ -n "$USUARIO" ] && [ -n "$TOKEN" ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            if [ -z "$USUARIO" ] || [ -z "$TOKEN" ]; then
              echo "::warning::Variável DOCKERHUB_USERNAME ou segredo DOCKERHUB_TOKEN não configurados: a imagem só é montada e testada."
            fi
          fi

      - uses: docker/setup-buildx-action@v3

      # Monta a imagem e carrega no runner para testar antes de publicar.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: VERSAO=${{ steps.nomes.outputs.versao }}
          tags: |
            ${{ steps.nomes.outputs.imagem }}:latest
            ${{ steps.nomes.outputs.imagem }}:${{ steps.nomes.outputs.versao }}
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site

      - name: Testar o container
        env:
          IMAGEM: ${{ steps.nomes.outputs.imagem }}:${{ steps.nomes.outputs.versao }}
          VERSAO: ${{ steps.nomes.outputs.versao }}
        run: |
          docker run -d --name site -p 8080:80 "$IMAGEM"
          sleep 3
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">' && echo "Página: OK"
          curl -fsS http://localhost:8080/listas | grep -q '<div id="root">' && echo "Rota do app: OK"
          test "$(curl -fsS http://localhost:8080/versao.txt)" = "$VERSAO" && echo "Versão: OK"
          docker rm -f site

      - name: Login no Docker Hub
        if: steps.nomes.outputs.publicar == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ steps.nomes.outputs.usuario }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push no Docker Hub
        if: steps.nomes.outputs.publicar == 'true'
        run: |
          docker push "${{ steps.nomes.outputs.imagem }}:${{ steps.nomes.outputs.versao }}"
          docker push "${{ steps.nomes.outputs.imagem }}:latest"

  deploy:
    name: Deploy (AWS Amplify)
    runs-on: ubuntu-latest
    needs: [lint-e-build, imagem]
    if: github.event_name != 'pull_request' && github.ref_name == 'mvp-comprafacil'
    steps:
      - name: Publicação pelo Amplify
        run: |
          echo "O AWS Amplify publica o branch ${BRANCH_DE_PRODUCAO} sozinho a cada push."
          echo "Endereço: ${SITE_URL}"

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: [lint-e-build, deploy]
    steps:
      - name: Esperar a versão nova no ar
        env:
          BUNDLE: ${{ needs.lint-e-build.outputs.bundle }}
        run: |
          # O build do Amplify leva uns 2 minutos.
          for tentativa in $(seq 1 40); do
            no_ar="$(curl -fsS "${SITE_URL}/?t=$(date +%s)" | grep -o '/assets/index-[^"]*\.js' | head -1 || true)"
            echo "Tentativa ${tentativa}: no ar ${no_ar:-?}, esperado ${BUNDLE}"
            if [ "$no_ar" = "$BUNDLE" ]; then
              echo "OK: o site no ar é o build deste commit."
              exit 0
            fi
            sleep 15
          done
          # Se o Amplify gerar um nome diferente, não é falha do site: avisa.
          echo "::warning::O site no ar não mostrou o arquivo ${BUNDLE} em 10 minutos."

      - name: Site e API respondendo
        run: |
          curl -fsS -o /dev/null "${SITE_URL}/" && echo "Site: OK"
          curl -fsS "${SITE_URL}/api/health/?t=$(date +%s)" && echo && echo "API: OK"
