# CI do frontend: a cada push ou pull request, confere o código.
# A publicação (CD) é feita pelo AWS Amplify a cada push no branch
# mvp-comprafacil (veja amplify.yml).
name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    name: Lint e build (TypeScript + Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Vite 8 precisa de Node 20.19+ ou 22.12+ (o mesmo do Amplify).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Checagem de tipos e build
        env:
          VITE_API_URL: /api
        run: npm run build
